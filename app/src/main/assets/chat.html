<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Claude</title>
<style>
:root{
  --bg:#FAF9F5;--surface:#FFFFFF;--text:#1F1E1D;--muted:#73726C;--line:#E8E6DC;
  --accent:#D97757;--btn:#C6613F;--user:#F0EEE6;--code:#F3F1EA;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Noto Serif",serif;
  --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#262624;--surface:#30302E;--text:#F0EEE6;--muted:#A3A19A;--line:#3E3E3B;
  --user:#3A3A37;--code:#1F1E1D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);
  overflow:hidden;user-select:none;-webkit-user-select:none;transition:background .25s,color .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lg{color:var(--accent);display:block}

#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;height:56px;padding:0 8px;flex-shrink:0}
header .ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
header .ib:active{background:var(--user)}
.brand{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.2px}

#msgs{flex:1;overflow-y:auto;padding:8px 16px;overscroll-behavior:contain;user-select:text;-webkit-user-select:text}
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;transition:height .2s}
.msg{display:flex;margin:14px 0;animation:slide .28s cubic-bezier(.2,.8,.2,1)}
.msg.user{justify-content:flex-end}
.user .bub{max-width:85%;background:var(--user);padding:10px 16px;border-radius:20px;font-size:16px;line-height:1.45;overflow-wrap:anywhere}
.ai .bub{width:100%;font-family:var(--serif);font-size:17px;line-height:1.6;overflow-wrap:anywhere}
.ai.err .bub{color:#C0392B;font-family:var(--sans);font-size:15px}
@keyframes slide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bub p{margin:0 0 10px}.bub p:last-child{margin-bottom:0}
.bub ul,.bub ol{padding-left:22px;margin:4px 0 10px}.bub li{margin:3px 0}
.bub h3,.bub h4,.bub h5{margin:14px 0 6px;font-weight:600}
.bub h3{font-size:1.25em}.bub h4{font-size:1.12em}
.bub a{color:var(--accent);text-decoration:underline}
.bub pre{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;overflow-x:auto;font-size:13px;line-height:1.45}
.bub code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}
.bub :not(pre)>code{background:var(--code);padding:2px 6px;border-radius:6px}

.typing{display:flex;align-items:center;gap:10px;padding:6px 0}
.typing .lg{width:22px;height:22px;animation:rot 2.4s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

#welcome{position:absolute;left:0;right:0;top:56px;bottom:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;pointer-events:none;animation:fade .5s}
#welcome .lg{width:56px;height:56px}
#welcome h1{font-family:var(--serif);font-size:32px;font-weight:500;letter-spacing:-.5px}
#welcome p{color:var(--muted);font-size:15px}
@keyframes fade{from{opacity:0}to{opacity:1}}

#composer{padding:6px 12px calc(6px + env(safe-area-inset-bottom));flex-shrink:0}
#box{display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 18px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
#inp{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.4;resize:none;max-height:130px;padding:9px 0;user-select:text;-webkit-user-select:text}
#inp::placeholder{color:var(--muted)}
#send{width:40px;height:40px;border-radius:14px;background:var(--btn);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .12s,opacity .2s;flex-shrink:0}
#send:active{transform:scale(.9)}
#send:disabled{opacity:.35}
.note{text-align:center;color:var(--muted);font-size:11.5px;padding:6px 0 0}

.scrim{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.s2{z-index:30}
#drawer{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:330px;background:var(--bg);z-index:21;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:8px}
#drawer.on{transform:none}
#drawer .top{display:flex;align-items:center;gap:10px;padding:12px 18px;font-family:var(--serif);font-size:24px;font-weight:500}
#drawer .top .lg{width:24px;height:24px}
.newbtn{margin:6px 14px 10px;padding:12px;border-radius:14px;background:var(--btn);color:#fff;font-weight:600;text-align:center}
#list{flex:1;overflow-y:auto;padding:0 8px}
.item{position:relative;overflow:hidden;border-radius:12px;margin:2px 0}
.item .del{position:absolute;top:0;bottom:0;left:0;right:0;background:#C0392B;color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;font-size:14px}
.item .row{position:relative;background:var(--bg);padding:13px 12px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .2s}
.item.active .row{background:var(--user)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
#drawer .foot{border-top:1px solid var(--line);padding:6px 8px}
#drawer .foot button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border-radius:12px;font-size:15px;text-align:left}
#drawer .foot button:active{background:var(--user)}

#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);z-index:31;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
#sheet h2{font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:8px}
#sheet label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
#sheet input,#sheet select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:15px;user-select:text;-webkit-user-select:text}
.btn{display:block;width:100%;padding:13px;border-radius:14px;margin-top:12px;font-weight:600;text-align:center;background:var(--user)}
.btn.pri{background:var(--btn);color:#fff}
.btn.danger{color:#C0392B}

/* splash / loading page */
#splash{position:fixed;top:0;left:0;right:0;bottom:0;background:#D97757;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash .lg{width:92px;height:92px;color:#fff;animation:pop 1s cubic-bezier(.3,.8,.3,1) both,pulse 1.6s 1s ease-in-out infinite}
#splash h1{font-family:var(--serif);color:#fff;font-size:38px;font-weight:500;letter-spacing:-.8px;animation:fade .8s .35s both}
@keyframes pop{from{transform:scale(.2) rotate(-180deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08) rotate(8deg)}}

#toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" xmlns:xlink="http://www.w3.org/1999/xlink">
  <symbol id="logo" viewBox="18 18 72 72">
    <g stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M54 54L54 22M54 54L66 33.2M54 54L80 39M54 54L76 54M54 54L81.7 70M54 54L67 76.5M54 54L54 84M54 54L43 73.1M54 54L26.3 70M54 54L30 54M54 54L28 39M54 54L41 31.5"/>
    </g>
  </symbol>
</svg>

<div id="splash">
  <svg class="lg"><use href="#logo" xlink:href="#logo"/></svg>
  <h1>Claude</h1>
</div>

<div id="app">
  <header>
    <button class="ib" id="menuBtn" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h16M4 16h10"/></svg></button>
    <div class="brand">Claude</div>
    <button class="ib" id="newBtn" aria-label="New chat"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <div id="msgs"><div id="ptr"></div><div id="thread"></div></div>

  <div id="composer">
    <div id="box">
      <textarea id="inp" rows="1" placeholder="Reply to Claude"></textarea>
      <button id="send" disabled aria-label="Send"></button>
    </div>
    <div class="note">Claude can make mistakes. Please double-check responses.</div>
  </div>
</div>

<div id="welcome">
  <svg class="lg"><use href="#logo" xlink:href="#logo"/></svg>
  <h1>Welcome to Claude</h1>
  <p>How can I help you today?</p>
</div>

<div class="scrim" id="scrim"></div>
<aside id="drawer">
  <div class="top"><svg class="lg"><use href="#logo" xlink:href="#logo"/></svg>Claude</div>
  <button class="newbtn" id="drawerNew">New chat</button>
  <div id="list"></div>
  <div class="foot"><button id="openSettings">
    <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    Claude Settings</button></div>
</aside>

<div class="scrim s2" id="scrim2"></div>
<section id="sheet">
  <div class="grab"></div>
  <h2>Claude Settings</h2>
  <label>API key</label>
  <input id="keyInp" type="password" placeholder="sk-ant-..." autocomplete="off">
  <label>Model</label>
  <input id="modelInp" type="text" list="models" placeholder="claude-sonnet-5-5" autocomplete="off">
  <datalist id="models"><option value="claude-sonnet-5-5"><option value="claude-opus-5-5"><option value="claude-haiku-5-5"></datalist>
  <label>Theme</label>
  <select id="themeSel"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
  <button class="btn pri" id="saveSet">Save</button>
  <button class="btn danger" id="clearAll">Clear all chats</button>
  <button class="btn" id="aboutBtn">About Claude</button>
</section>

<div id="toast"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var hasBridge=typeof Android!=="undefined";
  function buzz(ms){try{hasBridge&&Android.vibrate(ms)}catch(e){}}
  var LOGO='<svg class="lg"><use href="#logo" xlink:href="#logo"/></svg>';
  var UP='<svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  var STOP='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';

  /* ---------- storage ---------- */
  var DEF={key:"",model:"claude-sonnet-5-5",theme:"auto"};
  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var settings=Object.assign({},DEF,load("claude_settings",{}));
  var chats=load("claude_chats",[]);
  var cur=load("claude_cur",null);
  var busy=false,pending=null,live=null,sc=null,raf=0,barsReady=false;

  function persist(){save("claude_chats",chats);save("claude_cur",cur)}
  function getChat(){return chats.find(function(c){return c.id===cur})}

  /* ---------- theme ---------- */
  function applyTheme(){
    var dark=settings.theme==="dark"||(settings.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme",dark?"dark":"light");
    if(barsReady){try{hasBridge&&Android.setBars(dark)}catch(e){}}
  }
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
  applyTheme();

  /* ---------- markdown ---------- */
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function inline(s){
    return esc(s)
      .replace(/`([^`\n]+)`/g,"<code>$1</code>")
      .replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")
      .replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<i>$2</i>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s"]+)\)/g,'<a href="$2">$1</a>');
  }
  function block(t){
    var out="",list=null;
    function close(){if(list){out+="</"+list+">";list=null}}
    t.split("\n").forEach(function(l){
      var m;
      if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(list!=="ul"){close();out+="<ul>";list="ul"}out+="<li>"+inline(m[1])+"</li>"}
      else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=="ol"){close();out+="<ol>";list="ol"}out+="<li>"+inline(m[1])+"</li>"}
      else if((m=l.match(/^(#{1,3})\s+(.*)/))){close();var h=m[1].length+2;out+="<h"+h+">"+inline(m[2])+"</h"+h+">"}
      else if(!l.trim()){close()}
      else{close();out+="<p>"+inline(l)+"</p>"}
    });
    close();return out;
  }
  function md(t){
    var parts=t.split("```"),out="";
    for(var i=0;i<parts.length;i++){
      if(i%2){var p=parts[i],nl=p.indexOf("\n");out+="<pre><code>"+esc(nl>=0?p.slice(nl+1):p)+"</code></pre>"}
      else out+=block(parts[i]);
    }
    return out;
  }
  $("thread").addEventListener("click",function(e){
    var a=e.target.closest&&e.target.closest("a");
    if(a){e.preventDefault();try{hasBridge&&Android.openUrl(a.getAttribute("href"))}catch(x){}}
  });

  var toastT;
  function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on")},2200)}
  function scrollDown(){var m=$("msgs");m.scrollTop=m.scrollHeight}
  function nearBottom(){var m=$("msgs");return m.scrollHeight-m.scrollTop-m.clientHeight<140}

  /* ---------- render ---------- */
  function bubble(role,text,isErr){
    var d=document.createElement("div");
    d.className="msg "+(role==="user"?"user":"ai")+(isErr?" err":"");
    d.innerHTML='<div class="bub">'+(role==="user"?esc(text).replace(/\n/g,"<br>"):(isErr?esc(text):md(text)))+"</div>";
    return d;
  }
  function showTyping(){
    if($("typing"))return;
    var d=document.createElement("div");d.className="msg ai";d.id="typing";
    d.innerHTML='<div class="typing">'+LOGO+'</div>';
    $("thread").appendChild(d);scrollDown();
  }
  function hideTyping(){var t=$("typing");t&&t.remove()}
  function renderChat(){
    var th=$("thread");th.innerHTML="";
    var c=getChat();
    var has=c&&c.msgs.length>0;
    $("welcome").style.display=has?"none":"flex";
    if(c)c.msgs.forEach(function(m){th.appendChild(bubble(m.r,m.t,m.e))});
    if(busy&&sc&&c&&sc.id===c.id){if(live)live.el=th.lastChild;else showTyping()}
    scrollDown();
  }
  function renderList(){
    var l=$("list");l.innerHTML="";
    if(!chats.length){l.innerHTML='<div class="empty">No chats yet</div>';return}
    chats.slice().reverse().forEach(function(c){
      var it=document.createElement("div");
      it.className="item"+(c.id===cur?" active":"");
      it.innerHTML='<div class="del">Delete</div><div class="row"></div>';
      var row=it.querySelector(".row");
      row.textContent=c.title||"New chat";
      var sx=0,dx=0,moved=false;
      row.addEventListener("touchstart",function(e){sx=e.touches[0].clientX;dx=0;moved=false;row.style.transition="none"},{passive:true});
      row.addEventListener("touchmove",function(e){dx=Math.min(0,e.touches[0].clientX-sx);if(Math.abs(dx)>6)moved=true;row.style.transform="translateX("+dx+"px)"},{passive:true});
      row.addEventListener("touchend",function(){
        row.style.transition="";
        if(dx<-110){row.style.transform="translateX(-110%)";buzz(15);setTimeout(function(){delChat(c.id)},180)}
        else{row.style.transform="";if(!moved){cur=c.id;persist();renderChat();closeDrawer()}}
      });
      l.appendChild(it);
    });
  }
  function delChat(id){
    chats=chats.filter(function(c){return c.id!==id});
    if(cur===id)cur=null;
    persist();renderList();renderChat();
  }
  function newChat(){
    var c={id:"c"+Date.now(),title:"New chat",msgs:[]};
    chats.push(c);cur=c.id;persist();renderChat();renderList();
  }

  /* ---------- drawer / sheet ---------- */
  function openDrawer(){renderList();$("drawer").classList.add("on");$("scrim").classList.add("on")}
  function closeDrawer(){$("drawer").classList.remove("on");$("scrim").classList.remove("on")}
  function openSheet(){
    $("keyInp").value=settings.key;$("modelInp").value=settings.model;$("themeSel").value=settings.theme;
    $("sheet").classList.add("on");$("scrim2").classList.add("on");
  }
  function closeSheet(){$("sheet").classList.remove("on");$("scrim2").classList.remove("on")}
  $("menuBtn").onclick=openDrawer;
  $("scrim").onclick=closeDrawer;
  $("scrim2").onclick=closeSheet;
  $("newBtn").onclick=function(){newChat();buzz(10)};
  $("drawerNew").onclick=function(){newChat();closeDrawer()};
  $("openSettings").onclick=function(){closeDrawer();openSheet()};
  $("saveSet").onclick=function(){
    settings.key=$("keyInp").value.trim();
    settings.model=$("modelInp").value.trim()||DEF.model;
    settings.theme=$("themeSel").value;
    save("claude_settings",settings);applyTheme();closeSheet();toast("Saved");
  };
  $("clearAll").onclick=function(){
    if(confirm("Clear all chats?")){chats=[];cur=null;persist();renderList();renderChat();closeSheet();toast("Chats cleared")}
  };
  $("aboutBtn").onclick=function(){alert("Claude\nVersion 1.0\n\nA simple chat app powered by the Anthropic API.")};
  window.onBack=function(){
    if($("sheet").classList.contains("on")){closeSheet();return true}
    if($("drawer").classList.contains("on")){closeDrawer();return true}
    return false;
  };

  /* ---------- composer ---------- */
  var inp=$("inp"),sendBtn=$("send");
  function setBusy(b){
    busy=b;
    sendBtn.innerHTML=b?STOP:UP;
    sendBtn.disabled=b?false:!inp.value.trim();
  }
  inp.addEventListener("input",function(){
    inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,130)+"px";
    if(!busy)sendBtn.disabled=!inp.value.trim();
  });
  sendBtn.onclick=function(){busy?stop():doSend()};
  setBusy(false);

  function doSend(){
    var text=inp.value.trim();
    if(!text||busy)return;
    if(!settings.key){toast("Add your API key in Settings");openSheet();return}
    buzz(25);
    if(!getChat())newChat();
    var c=getChat();
    c.msgs.push({r:"user",t:text});
    if(c.msgs.length===1)c.title=text.slice(0,40);
    persist();
    inp.value="";inp.style.height="auto";
    $("welcome").style.display="none";
    $("thread").appendChild(bubble("user",text));
    sc=c;live=null;setBusy(true);showTyping();
    var hist=c.msgs.filter(function(m){return !m.e}).map(function(m){return{role:m.r==="user"?"user":"assistant",content:m.t}});
    pending="r"+Date.now();
    if(hasBridge){
      Android.send(pending,settings.key,settings.model,JSON.stringify(hist));
    }else{
      var id=pending,words="Preview mode: streaming works on the device with the Android bridge.".split(" "),i=0;
      var iv=setI
