<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Claude</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" xmlns:xlink="http://www.w3.org/1999/xlink">
  <symbol id="logo" viewBox="18 18 72 72">
    <g stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M54 54L54 22M54 54L66 33.2M54 54L80 39M54 54L76 54M54 54L81.7 70M54 54L67 76.5M54 54L54 84M54 54L43 73.1M54 54L26.3 70M54 54L30 54M54 54L28 39M54 54L41 31.5"/>
    </g>
  </symbol>
</svg>

<div id="splash">
  <svg class="lg"><use href="#logo" xlink:href="#logo"/></svg>
  <h1>Claude</h1>
</div>

<div id="app">
  <header>
    <button class="ib" id="menuBtn" aria-label="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h16M4 16h10"/></svg></button>
    <div class="brand">Claude</div>
    <button class="ib" id="newBtn" aria-label="New chat"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <div id="msgs"><div id="ptr"></div><div id="thread"></div></div>

  <div id="composer">
    <div id="box">
      <textarea id="inp" rows="1" placeholder="Reply to Claude"></textarea>
      <button id="send" disabled aria-label="Send"></button>
    </div>
    <div class="note">Claude can make mistakes. Please double-check responses.</div>
  </div>
</div>

<div id="welcome">
  <svg class="lg"><use href="#logo" xlink:href="#logo"/></svg>
  <h1>Welcome to Claude</h1>
  <p>How can I help you today?</p>
</div>

<div class="scrim" id="scrim"></div>
<aside id="drawer">
  <div class="top"><svg class="lg"><use href="#logo" xlink:href="#logo"/></svg>Claude</div>
  <button class="newbtn" id="drawerNew">New chat</button>
  <div id="list"></div>
  <div class="foot"><button id="openSettings">
    <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    Claude Settings</button></div>
</aside>

<div class="scrim s2" id="scrim2"></div>
<section id="sheet">
  <div class="grab"></div>
  <h2>Claude Settings</h2>
  <label>Provider</label>
  <select id="provSel"><option value="gemini">Google Gemini (free)</option><option value="claude">Anthropic Claude (paid)</option></select>
  <label>API key</label>
  <input id="keyInp" type="password" placeholder="AIza..." autocomplete="off">
  <div id="keyHint" class="hint"></div>
  <label>Model</label>
  <input id="modelInp" type="text" list="models" placeholder="gemini-flash-latest" autocomplete="off">
  <datalist id="models"><option value="claude-sonnet-5-5"><option value="claude-opus-5-5"><option value="claude-haiku-5-5"></datalist>
  <label>Theme</label>
  <select id="themeSel"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
  <button class="btn pri" id="saveSet">Save</button>
  <button class="btn danger" id="clearAll">Clear all chats</button>
  <button class="btn" id="aboutBtn">About Claude</button>
</section>

<div id="toast"></div>
<div id="errbox"></div>
<script src="boot.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
