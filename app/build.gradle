plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anthropic.claude.huawei'
    compileSdk 34

    defaultConfig {
        applicationId "com.anthropic.claude.huawei"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        resValue "string", "app_name", "Claude"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
